<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wedding Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Great+Vibes&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:'Montserrat',sans-serif;
}

body{
  perspective:1200px;
}

/* ===== SCREENS ===== */
.screen{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  transition:opacity 1s ease;
}

.hidden{
  opacity:0;
  pointer-events:none;
}

/* ===== SCREEN 1 ===== */
#screen1{
  background:#efe4d6;
  flex-direction:column;
  z-index:10;
}

.folder{
  width:220px;
  height:150px;
  background:#d8c4a3;
  border-radius:8px;
  position:relative;
  cursor:pointer;
  z-index:20;
  animation:float 2.5s ease-in-out infinite;
}

.folder::before{
  content:"";
  position:absolute;
  top:-30px;
  left:0;
  width:100%;
  height:40px;
  background:#c9b08a;
  border-radius:8px 8px 0 0;
  transform-origin:bottom;
  transition:transform .6s ease;
}

.folder.open::before{
  transform:rotateX(140deg);
}

.open-text{
  margin-top:20px;
  color:#5a4632;
}

@keyframes float{
  50%{transform:translateY(-10px)}
}

/* ===== SCREEN 2 ===== */
#screen2{
  background:linear-gradient(
    to bottom,
    #f2e7da,
    #d8c2a8,
    #9b6b3f,
    #4a2c1d
  );
  color:#3b2a1a;
  z-index:1;
}

/* Names */
.names-section{
  position:absolute;
  top:18%;
  width:100%;
  text-align:center;
}

.names-section h1{
  font-family:'Great Vibes',cursive;
  font-size:6rem;
}

/* Countdown */
.countdown-wrapper{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

.countdown{
  display:flex;
  gap:2rem;
}

.countdown div{
  background:rgba(255,255,255,.25);
  padding:1.6rem;
  border-radius:22px;
  min-width:120px;
  text-align:center;
}

.countdown span{
  font-family:'Playfair Display',serif;
  font-size:2.8rem;
}

@media(max-width:600px){
  .names-section h1{font-size:3.8rem}
}
</style>
</head>

<body>

<!-- SCREEN 1 -->
<div class="screen" id="screen1">
  <div class="folder" id="folder"></div>
  <div class="open-text">Please Open</div>
</div>

<!-- SCREEN 2 -->
<div class="screen hidden" id="screen2">
  <div class="names-section">
    <h1>Dooley &amp; Chari</h1>
  </div>

  <div class="countdown-wrapper">
    <div class="countdown">
      <div><span id="days">0</span><label>DAYS</label></div>
      <div><span id="hours">0</span><label>HOURS</label></div>
      <div><span id="minutes">0</span><label>MINUTES</label></div>
      <div><span id="seconds">0</span><label>SECONDS</label></div>
    </div>
  </div>
</div>

<script>
const folder = document.getElementById("folder");
const screen1 = document.getElementById("screen1");
const screen2 = document.getElementById("screen2");

let audioStarted = false;

folder.addEventListener("click", () => {

  // OPEN FOLDER
  folder.classList.add("open");

  // START MUSIC (USER GESTURE)
  if (!audioStarted) {
    const music = new Audio("SONG/song.mp3");
    music.loop = true;
    music.volume = 0.8;
    music.play();
    audioStarted = true;
  }

  // SHOW INVITATION
  setTimeout(() => {
    screen1.classList.add("hidden");
    screen2.classList.remove("hidden");
    screen1.style.zIndex = "1";
    screen2.style.zIndex = "10";
  }, 700);

});

/* COUNTDOWN */
const targetDate = new Date(Date.UTC(2026,3,18,5,0,0));
setInterval(()=>{
  const diff = targetDate - new Date();
  if(diff<=0) return;
  days.textContent = Math.floor(diff/86400000);
  hours.textContent = Math.floor(diff/3600000%24);
  minutes.textContent = Math.floor(diff/60000%60);
  seconds.textContent = Math.floor(diff/1000%60);
},1000);
</script>

</body>
</html>
